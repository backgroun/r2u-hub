<title>R2U 크루 허브</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,500..900&family=IBM+Plex+Sans+KR:wght@400;500;700&display=swap">
<style id="r2u-style">
/* Layout: one narrow column — logo masthead, then a stack of full-width link rows like a race-day board; admin tools slide in below. */
:root{
  --bg:#f6f6f4; --surface:#ffffff; --fg:#141414; --muted:#6a6a66; --line:#e2e2de;
  --accent:#ff5a1f; --accent-ink:#ffffff; --danger:#c42b2b;
  --f-display:"Archivo","IBM Plex Sans KR",system-ui,sans-serif;
  --f-body:"IBM Plex Sans KR",system-ui,-apple-system,sans-serif;
  --logo:url("data:image/png;base64,__LOGO__");
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#111111; --surface:#1b1b1a; --fg:#f2f2ee; --muted:#9c9c96; --line:#2c2c2a;
  --accent:#ff6a33; --accent-ink:#111111; --danger:#ff7070; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#111111; --surface:#1b1b1a; --fg:#f2f2ee; --muted:#9c9c96; --line:#2c2c2a;
  --accent:#ff6a33; --accent-ink:#111111; --danger:#ff7070; color-scheme:dark}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:15px;line-height:1.55}
.wrap{max-width:640px;margin:0 auto;padding-inline:16px;padding-block:28px 56px;display:flex;flex-direction:column;gap:28px}
header{display:flex;align-items:center;gap:18px}
.logo{width:68px;aspect-ratio:313/360;background:var(--fg);-webkit-mask:var(--logo) center/contain no-repeat;mask:var(--logo) center/contain no-repeat;flex:none}
.mast{min-width:0}
.mast h1{margin:0;font-family:var(--f-display);font-stretch:72%;font-weight:900;font-size:clamp(28px,7vw,40px);line-height:1;letter-spacing:.01em;text-transform:uppercase}
.mast p{margin:6px 0 0;color:var(--muted);font-size:14px}
.top{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap}
.top h2{margin:0;font-family:var(--f-display);font-stretch:90%;font-size:12px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.list{display:flex;flex-direction:column;border-top:2px solid var(--fg)}
.row{display:grid;grid-template-columns:1fr auto;align-items:center;gap:6px 14px;padding:18px 4px;border-bottom:1px solid var(--line);color:inherit;text-decoration:none;transition:background .15s}
a.row:hover{background:var(--surface)}
a.row:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
.row .t{min-width:0;display:flex;flex-direction:column;gap:3px}
.row .name{font-size:18px;font-weight:700;line-height:1.3;text-wrap:balance}
.row .desc{color:var(--muted);font-size:14px}
.row .meta{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:12px;color:var(--muted)}
.tag{font-family:var(--f-display);font-stretch:85%;font-weight:700;font-size:11px;letter-spacing:.08em;text-transform:uppercase;padding:2px 7px;border-radius:3px;background:var(--fg);color:var(--bg)}
.go{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;background:var(--accent);color:var(--accent-ink);font-weight:900;font-size:18px;transition:transform .15s}
a.row:hover .go{transform:translateX(3px)}
.empty{padding:28px 4px;color:var(--muted);border-bottom:1px solid var(--line)}
button,.btn{font:inherit;font-size:14px;font-weight:700;border-radius:6px;border:1.5px solid var(--fg);background:transparent;color:var(--fg);padding:8px 14px;cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
button.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
button.ghost{border-color:var(--line);font-weight:500;padding:6px 10px;font-size:13px}
button.del{color:var(--danger);border-color:var(--line)}
button:disabled{opacity:.45;cursor:not-allowed}
.admin-row{grid-template-columns:1fr;padding:14px 4px}
.admin-row .ctl{display:flex;gap:6px;flex-wrap:wrap}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:18px;display:flex;flex-direction:column;gap:12px}
.panel h3{margin:0;font-size:16px}
.fields{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.fields .full{grid-column:1/-1}
label{display:flex;flex-direction:column;gap:4px;font-size:12px;font-weight:700;color:var(--muted);min-width:0}
input,select{font:inherit;font-size:15px;color:var(--fg);background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:9px 10px;width:100%;box-sizing:border-box}
.actions{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.status{font-size:13px;color:var(--muted)}
.status.err{color:var(--danger)}
.badge{font-size:12px;font-weight:700;color:var(--accent)}
footer{font-size:12px;color:var(--muted)}
@media (max-width:480px){.fields{grid-template-columns:1fr}.logo{width:54px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
<div class="wrap">
  <header>
    <div class="logo" role="img" aria-label="R2U Run To Ulsan 로고"></div>
    <div class="mast">
      <h1>Run To Ulsan</h1>
      <p>R2U 러닝크루 링크 모음 · 필요한 곳으로 바로 이동하세요</p>
    </div>
  </header>
  <section>
    <div class="top">
      <h2>Crew Links</h2>
      <div class="actions" id="admin-toggle-wrap" hidden>
        <span class="badge" id="dirty" hidden>저장 안 된 변경 있음</span>
        <button type="button" id="admin-toggle">운영진 모드</button>
      </div>
    </div>
    <div class="list" id="list" style="margin-top:10px"></div>
  </section>
  <section id="admin" hidden>
    <form class="panel" id="form" autocomplete="off">
      <h3 id="form-title">페이지 추가</h3>
      <div class="fields">
        <label>이름<input id="f-title" required maxlength="40" placeholder="예: 정기런 출석체크"></label>
        <label>분류<select id="f-tag"></select></label>
        <label class="full">주소 (URL)<input id="f-url" required type="url" placeholder="https://"></label>
        <label class="full">한 줄 설명<input id="f-desc" maxlength="80" placeholder="예: 매주 목요일 태화강 정기런 출석"></label>
      </div>
      <div class="actions">
        <button type="submit" class="primary" id="f-submit">목록에 추가</button>
        <button type="button" id="f-cancel" hidden>취소</button>
      </div>
    </form>
    <div class="panel" style="margin-top:12px">
      <div class="actions">
        <button type="button" class="primary" id="save" disabled>변경사항 저장</button>
        <button type="button" id="revert" disabled>되돌리기</button>
        <span class="status" id="status">추가·수정·순서 변경 후 저장하면 모든 크루원에게 반영돼요.</span>
      </div>
    </div>
  </section>
  <footer>R2U · Run To Ulsan</footer>
</div>
<script type="application/json" id="r2u-data">__DATA__</script>
<script id="r2u-app">
(function(){
  var TAGS=["이벤트","공구","커뮤니티","기록","공지","기타"];
  var saved=JSON.parse(document.getElementById("r2u-data").textContent);
  var links=saved.links.map(function(l){return Object.assign({},l)});
  var admin=false, editing=null, dirty=false, canWrite=false;
  var $=function(id){return document.getElementById(id)};
  function host(u){try{return new URL(u).hostname.replace(/^www\./,"")}catch(e){return u}}
  function el(tag,cls,text){var e=document.createElement(tag);if(cls)e.className=cls;if(text!=null)e.textContent=text;return e}

  function render(){
    var list=$("list");list.textContent="";
    if(!links.length){list.appendChild(el("div","empty","아직 등록된 페이지가 없어요. 운영진 모드에서 첫 페이지를 추가해 주세요."));}
    links.forEach(function(l,i){
      var row, t=el("div","t"), meta=el("div","meta");
      meta.appendChild(el("span","tag",l.tag||"기타"));
      meta.appendChild(el("span",null,host(l.url)));
      t.appendChild(meta);
      t.appendChild(el("span","name",l.title));
      if(l.desc)t.appendChild(el("span","desc",l.desc));
      if(!admin){
        row=el("a","row");row.href=l.url;row.target="_blank";row.rel="noopener noreferrer";
        row.appendChild(t);var go=el("span","go","→");go.setAttribute("aria-hidden","true");row.appendChild(go);
      }else{
        row=el("div","row admin-row");row.appendChild(t);
        var c=el("div","ctl");
        c.appendChild(btn("↑ 위로",i===0,function(){move(i,-1)}));
        c.appendChild(btn("↓ 아래로",i===links.length-1,function(){move(i,1)}));
        c.appendChild(btn("수정",false,function(){startEdit(i)}));
        var d=btn("삭제",false,function(){ if(d.dataset.arm){links.splice(i,1);touch();} else {d.dataset.arm="1";d.textContent="정말 삭제?";} });
        d.classList.add("del");c.appendChild(d);
        row.appendChild(c);
      }
      list.appendChild(row);
    });
    $("dirty").hidden=!dirty;$("save").disabled=!dirty;$("revert").disabled=!dirty;
  }
  function btn(label,disabled,fn){var b=el("button","ghost",label);b.type="button";b.disabled=disabled;b.onclick=fn;return b}
  function move(i,d){var x=links[i];links[i]=links[i+d];links[i+d]=x;touch()}
  function touch(){dirty=true;status("");render()}
  function status(msg,err){var s=$("status");s.textContent=msg||"추가·수정·순서 변경 후 저장하면 모든 크루원에게 반영돼요.";s.className="status"+(err?" err":"")}

  function resetForm(){editing=null;$("form").reset();$("form-title").textContent="페이지 추가";$("f-submit").textContent="목록에 추가";$("f-cancel").hidden=true}
  function startEdit(i){var l=links[i];editing=i;$("f-title").value=l.title;$("f-url").value=l.url;$("f-desc").value=l.desc||"";$("f-tag").value=l.tag||"기타";
    $("form-title").textContent="페이지 수정";$("f-submit").textContent="수정 적용";$("f-cancel").hidden=false;$("f-title").focus()}

  TAGS.forEach(function(t){var o=el("option",null,t);o.value=t;$("f-tag").appendChild(o)});
  $("form").addEventListener("submit",function(e){
    e.preventDefault();
    var item={title:$("f-title").value.trim(),url:$("f-url").value.trim(),desc:$("f-desc").value.trim(),tag:$("f-tag").value};
    if(!item.title||!/^https?:\/\//.test(item.url)){status("이름과 https:// 로 시작하는 주소를 입력해 주세요.",true);return}
    if(editing!=null)links[editing]=item;else links.push(item);
    resetForm();touch();
  });
  $("f-cancel").onclick=resetForm;
  $("revert").onclick=function(){links=saved.links.map(function(l){return Object.assign({},l)});dirty=false;resetForm();status("");render()};
  $("admin-toggle").onclick=function(){admin=!admin;$("admin").hidden=!admin;$("admin-toggle").textContent=admin?"운영진 모드 끄기":"운영진 모드";render()};

  function buildDoc(){
    var reset=(document.head.querySelector("style")||{}).textContent||"";
    var json=JSON.stringify({links:links}).replace(/</g,"\\u003c");
    var body=document.querySelector("title").outerHTML
      +document.querySelector('link[href*="fonts.googleapis"]').outerHTML
      +$("r2u-style").outerHTML
      +TEMPLATE
      +'<script type="application/json" id="r2u-data">'+json+'<\/script>'
      +'<script id="r2u-app">'+$("r2u-app").textContent+'<\/script>';
    return '<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>'+reset+'</style></head><body>'+body+'</body></html>';
  }
  var TEMPLATE=document.getElementById("r2u-data").previousElementSibling.outerHTML;

  $("save").onclick=async function(){
    var art=await window.claude.use("artifact");
    if(!art){status("이 화면에서는 저장할 수 없어요. claude.ai에서 편집 권한으로 열어 주세요.",true);return}
    $("save").disabled=true;status("저장 중…");
    try{ await art.publish(buildDoc()); status("저장했어요. 페이지가 새로 고쳐집니다."); }
    catch(err){
      var c=err&&err.code;
      if(c==="conflict")status("다른 운영진이 먼저 저장했어요. 최신 내용으로 새로 고쳐집니다.",true);
      else if(c==="not_writer"||c==="not_granted"){status("편집 권한이 없어 저장할 수 없어요.",true);}
      else if(c==="rate_limited")status("저장이 너무 잦아요. 잠시 후 다시 눌러 주세요.",true);
      else status("저장하지 못했어요 ("+(c||"오류")+"). 잠시 후 다시 시도해 주세요.",true);
      $("save").disabled=!dirty;
    }
  };

  render();
  (async function(){
    if(!window.claude||!window.claude.use)return;
    var user=await window.claude.use("user");
    canWrite=user?await user.canEdit():false;
    if(canWrite)$("admin-toggle-wrap").hidden=false;
  })();
})();
</script>
