<!doctype html>
<html lang="ko">
<head>
<base href="/bingo/">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#2f6b3a">
<title>R2U 5×5 미션 빙고</title>
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="apple-mobile-web-app-title" content="R2U 빙고">
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="photo.css">
<link rel="stylesheet" href="admin.css">
<link rel="stylesheet" href="report.css">
<link rel="stylesheet" href="fx.css">
</head>
<body>
<div class="wrap">
  <header class="hero">
    <h1><span class="crew">R2U</span> 5×5 미션 <b>빙고</b></h1>
    <p id="heroPeriod"></p>
  </header>

  <section class="card" id="meCard">
    <div id="login">
      <div class="namebox">
        <label for="who">참가자</label>
        <select id="who"><option value="">불러오는 중…</option></select>
      </div>
      <div class="namebox">
        <label for="pw">비밀번호</label>
        <input id="pw" type="text" class="pw-mask" maxlength="20" placeholder="비밀번호" autocomplete="off" autocapitalize="none" autocorrect="off" spellcheck="false" data-lpignore="true" data-1p-ignore>
      </div>
      <div class="namebox" id="pw2row" hidden>
        <label for="pw2">비번 확인</label>
        <input id="pw2" type="text" class="pw-mask" maxlength="20" placeholder="한 번 더 입력" autocomplete="off" autocapitalize="none" autocorrect="off" spellcheck="false" data-lpignore="true" data-1p-ignore>
      </div>
      <div class="actions"><button class="btn main" id="enter" type="button">입장</button></div>
      <p class="hint" id="loginHint"></p>
    </div>
    <div id="hubEnter" hidden>
      <p class="hint" id="hubEnterMsg">입장하는 중…</p>
      <div class="actions"><button class="btn main" id="hubRetry" type="button" hidden>다시 시도</button></div>
    </div>
    <div class="me-row" id="me" hidden>
      <span class="who"><span id="meName"></span><small> 님</small></span>
      <span class="stat">
        <span>완료 <strong id="cnt">0</strong>/25</span>
        <span>빙고 <strong id="bingo">0</strong>줄</span>
      </span>
      <span class="me-acts">
        <button class="btn ghost mini" id="fxToggle" type="button" aria-label="효과음 끄기">🔊</button>
        <button class="btn ghost mini" id="logout" type="button">다른 사람</button>
      </span>
    </div>
    <div class="bar"><i id="bar"></i></div>
  </section>

  <p class="edit-banner" id="editBanner" hidden>✏️ 수정 모드 · 칸을 눌러 이모지·제목·설명을 고치세요</p>
  <main class="grid" id="grid" aria-label="미션 빙고판"></main>

  <div class="actions">
    <button class="btn sub" id="reportOpen" type="button" hidden>📋 내 리포트</button>
    <button class="btn main" id="copy" type="button">내 현황 복사</button>
  </div>

  <section class="card board" id="board" hidden>
    <div class="head">
      <h2>크루 전체 현황</h2>
      <button class="btn ghost mini" id="refresh" type="button">새로고침</button>
    </div>
    <p class="sum" id="boardSum"></p>
    <ol class="rank" id="rank"></ol>
  </section>

  <section class="card info" id="infoCard" hidden>
    <h2 id="infoTitle"></h2>
  </section>
  <button class="reset" id="reset" type="button">내 기록 초기화</button>
  <button class="reset" id="adminOpen" type="button" hidden>운영진 모드</button>
</div>

<div class="dim" id="dim"></div>
<div class="sheet" id="eSheet" role="dialog" aria-modal="true" aria-label="미션 수정">
  <div class="top">
    <div class="big" id="eIcon"></div>
    <div>
      <div class="num" id="eNum"></div>
      <h3>미션 수정</h3>
    </div>
  </div>
  <div class="field"><label for="eEmoji">이모지</label><input id="eEmoji" type="text" maxlength="8" autocomplete="off"></div>
  <div class="field"><label for="eTitle">제목</label><textarea id="eTitle" rows="2" maxlength="40" autocomplete="off" placeholder="엔터로 줄을 나눌 수 있어요"></textarea></div>
  <div class="field"><label for="eDesc">설명</label><textarea id="eDesc" rows="3" maxlength="120" autocomplete="off" placeholder="설명 (비워도 돼요)"></textarea></div>
  <div class="btns">
    <button class="btn ghost" id="eClose" type="button">닫기</button>
    <button class="btn main" id="eOk" type="button">저장</button>
  </div>
</div>
<div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sTitle">
  <div class="top">
    <div class="big" id="sIcon"></div>
    <div>
      <div class="num" id="sNum"></div>
      <h3 id="sTitle"></h3>
    </div>
  </div>
  <p class="desc" id="sDesc"></p>
  <p class="state" id="sState"></p>
  <div class="field">
    <label for="sDate">수행 날짜</label>
    <input id="sDate" type="date">
  </div>
  <div class="field" id="photoField">
    <label>인증 사진 <small id="sPhotoReq"></small></label>
    <div class="photo-row">
      <button class="btn ghost" id="sPhotoBtn" type="button">📷 사진 고르기</button>
      <button class="btn ghost mini" id="sPhotoClear" type="button" hidden>빼기</button>
    </div>
    <input id="sPhotoIn" type="file" accept="image/*" hidden>
    <img id="sPrev" class="prev" alt="선택한 인증 사진 미리보기" hidden>
  </div>
  <div class="btns">
    <button class="btn danger" id="sUndo" type="button" hidden>인증 취소</button>
    <button class="btn ghost" id="sClose" type="button">닫기</button>
    <button class="btn main" id="sOk" type="button">인증완료</button>
  </div>
</div>
<div class="admin" id="admin" role="dialog" aria-modal="true" aria-label="운영진 모드" hidden>
  <div class="admin-in">
    <div class="admin-top">
      <b>🛠 운영진 모드</b>
      <button class="btn ghost mini" id="adminClose" type="button">닫기</button>
    </div>
    <div id="adminLogin">
      <p class="hint">운영진 비밀 문장을 입력하세요. (이 화면을 닫으면 다시 입력해야 해요)</p>
      <div class="namebox"><label for="adminPw">비밀 문장</label>
        <input id="adminPw" type="text" autocomplete="off" autocapitalize="none" autocorrect="off" spellcheck="false" placeholder="운영진 비밀 문장"></div>
      <div class="actions"><button class="btn main" id="adminGo" type="button">확인</button></div>
    </div>
    <div id="adminBody" hidden>
      <div class="tabs" role="tablist">
        <button type="button" class="tab on" data-tab="members">멤버</button>
        <button type="button" class="tab" data-tab="missions">미션</button>
        <button type="button" class="tab" data-tab="info">안내·기간</button>
      </div>
      <section id="tab-members">
        <div class="addrow"><input id="newMember" maxlength="20" placeholder="새 멤버 이름(닉네임)"><button class="btn main mini" id="addMember" type="button">추가</button></div>
        <ul class="mlist" id="memberList"></ul>
      </section>
      <section id="tab-missions" hidden>
        <p class="hint">고친 칸의 [저장]을 눌러야 반영돼요. 이미 인증한 기록의 미션 이름도 같이 바뀌어요.</p>
        <ul class="mlist" id="missionList"></ul>
      </section>
      <section id="tab-info" hidden>
        <div class="field2"><label for="infoStart">시작일</label><input id="infoStart" type="date"></div>
        <div class="field2"><label for="infoEnd">종료일</label><input id="infoEnd" type="date"></div>
        <div class="field2"><label for="infoTitleIn">안내 제목</label><input id="infoTitleIn" maxlength="30"></div>
        <div class="lab">안내 문구 (한 줄에 하나씩, 최대 12줄)</div>
        <div id="infoRows"></div>
        <button class="btn ghost mini" id="infoAddRow" type="button">＋ 줄 추가</button>
        <div class="actions"><button class="btn main" id="infoSave" type="button">안내·기간 저장</button></div>
      </section>
    </div>
  </div>
</div>
<div class="report" id="report" role="dialog" aria-modal="true" aria-label="내 리포트" hidden>
  <div class="report-in">
    <div class="report-top">
      <b id="reportTitle">내 리포트</b>
      <button class="btn ghost mini" id="reportClose" type="button">닫기</button>
    </div>
    <p class="report-sum" id="reportSum"></p>
    <div class="report-save" id="reportSave">
      <button class="btn main" id="reportImg" type="button" disabled>🖼 이미지로 저장</button>
      <small id="reportImgHint"></small>
    </div>
    <div id="reportShots" hidden></div>
    <div id="reportList"></div>
  </div>
</div>
<div class="toast" id="toast" role="status"></div>

<script src="config.js"></script>
<script src="missions.js"></script>
<script src="app.js"></script>
<script src="photo.js"></script>
<script>Photo.init();</script>
<script src="admin.js"></script>
<script src="report.js"></script>
<script src="fx.js"></script>

<!-- R2U 허브로 가는 위쪽 메뉴 (허브와 같은 메뉴) -->
<script>if (self !== top) document.documentElement.classList.add("in-hub");</script>
<nav class="r2u-tabbar" aria-label="R2U 메뉴">
  <a href="/" data-k="home"><svg viewBox="0 0 24 24"><path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg><span>홈</span></a>
  <a href="/races" data-k="races"><svg viewBox="0 0 24 24"><path d="M5 21V4"/><path d="M5 4h11l-2 4 2 4H5"/></svg><span>대회</span></a>
  <a href="/monthly" data-k="monthly"><svg viewBox="0 0 24 24"><path d="M4 20V10"/><path d="M10 20V4"/><path d="M16 20v-7"/><path d="M21 20H3"/></svg><span>월간기록</span></a>
  <a href="/groupbuy" data-k="groupbuy"><svg viewBox="0 0 24 24"><path d="M6 7h12l-1 13H7z"/><path d="M9 7a3 3 0 0 1 6 0"/></svg><span>공구</span></a>
  <a href="/bingo" data-k="bingo" class="on" aria-current="page"><svg viewBox="0 0 24 24"><rect x="4" y="4" width="16" height="16" rx="3"/><path d="M4 9.3h16M4 14.6h16M9.3 4v16M14.6 4v16"/></svg><span>이벤트</span></a>
  <a href="/me" data-k="me"><svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/></svg><span>내 페이지</span></a>
  <a href="/admin" data-k="admin" hidden><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M4.2 4.2l2.1 2.1M17.7 17.7l2.1 2.1M2 12h3M19 12h3M4.2 19.8l2.1-2.1M17.7 6.3l2.1-2.1"/></svg><span>운영진</span></a>
</nav>
<style>
  .r2u-tabbar { position: fixed; left: 0; right: 0; top: 0; z-index: 40; display: flex; justify-content: space-around;
    padding: calc(6px + env(safe-area-inset-top, 0px)) 4px 6px; background: rgba(20, 28, 22, .86);
    -webkit-backdrop-filter: saturate(180%) blur(20px); backdrop-filter: saturate(180%) blur(20px); border-bottom: .5px solid rgba(255,255,255,.14); }
  .r2u-tabbar a { flex: 1; min-width: 0; display: grid; justify-items: center; gap: 2px; padding: 2px 0; color: rgba(255,255,255,.62);
    font: 600 10px/1.2 -apple-system, "Pretendard", "Apple SD Gothic Neo", sans-serif; text-decoration: none; -webkit-tap-highlight-color: transparent; }
  .r2u-tabbar a span { max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .r2u-tabbar a.on { color: #ffd23f; }
  .r2u-tabbar a:active { opacity: .55; }
  .r2u-tabbar svg { width: 24px; height: 24px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
  body { padding-top: calc(52px + env(safe-area-inset-top, 0px)); }
  /* 허브 안(iframe)에서 열릴 때는 허브 메뉴가 이미 위에 있으니 이 메뉴는 숨긴다 */
  html.in-hub .r2u-tabbar { display: none; }
  html.in-hub body { padding-top: 0; }
  /* 허브 안에서는 허브 로그인으로 자동 입장하니 "다른 사람" 버튼은 필요 없다 */
  html.in-hub #logout { display: none; }
  /* 허브 안에서는 참가자·비밀번호·입장 화면 없이 허브 로그인으로 바로 입장한다 */
  html.in-hub #login { display: none !important; }
  /* 운영 설정은 허브 운영진 → 이벤트 탭에서 한다 */
  #adminOpen { display: none !important; }
  /* 닉네임 옆에 완료·빙고 현황을 한 줄로 */
  .me-row { justify-content: flex-start; gap: 12px; flex-wrap: nowrap; }
  .me-row .who { flex: none; white-space: nowrap; }
  .me-row .stat { margin: 0; flex: 1 1 auto; justify-content: flex-end; gap: 14px; font-size: 11.5px; font-weight: 500; color: var(--dim); white-space: nowrap; letter-spacing: .03em; }
  .me-row .stat > span { display: inline-flex; align-items: baseline; gap: 5px; padding: 0; background: none; }
  .me-row .stat strong { font-size: 17px; font-weight: 600; color: var(--text); }
  .me-row .who { font-size: 17px; }
  #meCard .bar { height: 3px; margin-top: 12px; }
  .me-row .me-acts { flex: none; }
  /* 효과음 켜고 끄는 스피커 버튼은 쓰지 않는다 */
  #fxToggle { display: none !important; }
  /* 참가 신청 전 미리보기(?preview=1): 빙고판과 안내만 보여 준다 */
  body.preview #meCard, body.preview .actions, body.preview #board, body.preview .reset { display: none !important; }
  /* 미리보기에서 미션 내용은 볼 수 있지만 인증(기록 등록)은 못 한다 */
  body.preview #sheet .field, body.preview #sOk, body.preview #sUndo { display: none !important; }
  /* 운영진 수정 모드: 칸을 눌러 이모지·제목·설명을 고친다 */
  .edit-banner { margin: 0 0 10px; padding: 9px 14px; border-radius: 12px; background: var(--panel2); color: var(--gold); border: 1px dashed var(--gold-line); font-size: 12.5px; font-weight: 600; text-align: center; letter-spacing: .01em; }
  body.editing .cell { border-style: dashed; border-color: var(--gold-line); }
  /* 줄바꿈은 입력한 그대로 보여 준다 */
  .cell .tt, #sTitle, #sDesc { white-space: pre-line; }
  .sheet .field textarea { flex: 1; font-size: 16px; padding: 10px; border: 1.5px solid #cfd8cf; border-radius: 10px; font-family: inherit; resize: none; line-height: 1.4; }
  #eSheet .field { align-items: flex-start; }
  #eSheet .field label { padding-top: 10px; }
  html.in-hub .toast { top: 12px; transform: translate(-50%, -200%); opacity: 0; transition: transform .25s, opacity .25s; }
  html.in-hub .toast.on { transform: translate(-50%, 0); opacity: 1; }
</style>
<script>
  // 운영진이 바꾼 메뉴 이름을 허브에서 받아 온다
  fetch('/api/menu', { cache: 'no-store' }).then(r => r.ok ? r.json() : null).then(m => {
    if (!m) return;
    for (const k of ['races', 'monthly', 'groupbuy', 'bingo']) {
      const el = document.querySelector('.r2u-tabbar [data-k="' + k + '"] span');
      if (el && m[k]) el.textContent = m[k];
    }
  }).catch(() => {});
  // 내 페이지 칸은 내 닉네임으로, 운영진이면 운영진 메뉴도 보여 준다
  fetch('/api/me', { cache: 'no-store' }).then(r => r.ok ? r.json() : null).then(j => {
    if (!j) return;
    const me = document.querySelector('.r2u-tabbar [data-k="me"]'), ad = document.querySelector('.r2u-tabbar [data-k="admin"]');
    if (j.nick) me.querySelector('span').textContent = [...j.nick].slice(0, 4).join('') + '님'; // 4글자까지만
    if (j.staff) me.hidden = true;
    if (j.admin || j.staff) ad.hidden = false;
  }).catch(() => {});
</script>
</body>
</html>
